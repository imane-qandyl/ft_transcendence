services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_transcendence_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=/app/db/data.sqlite3
    ports:
      - "3000:3000"
    volumes:
      - backend_data:/app/db
    networks:
      - ft_network

  # Frontend service with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_WS_URL=${REACT_APP_WS_URL}
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID}
    container_name: ft_transcendence_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3001:80"
      - "8443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ft_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SSL certificate generator (runs once)
  ssl-generator:
    image: alpine:latest
    container_name: ft_transcendence_ssl
    volumes:
      - ./ssl:/ssl
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache openssl > /dev/null 2>&1
        if [ ! -f /ssl/cert.pem ]; then
          echo 'Generating SSL certificates...'
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/key.pem \
            -out /ssl/cert.pem \
            -subj '/C=FR/ST=IDF/L=Paris/O=42/OU=ft_transcendence/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.12.4.1'
          chmod 644 /ssl/cert.pem /ssl/key.pem
          echo 'SSL certificates generated successfully!'
        else
          echo 'SSL certificates already exist.'
        fi
    networks:
      - ft_network

networks:
  ft_network:
    driver: bridge

volumes:
  backend_data:
    driver: local
