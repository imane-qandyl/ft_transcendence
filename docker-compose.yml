services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_transcendence_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-change-this-super-secret-jwt-key-in-production-min-32-chars}
      - JWT_EXPIRES_IN=1h
      - COOKIE_SECRET=${COOKIE_SECRET:-change-this-super-secret-cookie-key-in-production-min-32}
      - FRONTEND_URL=https://localhost
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - DATABASE_URL=/app/db/data.sqlite3
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60000
      - BCRYPT_ROUNDS=12
    volumes:
      - backend_data:/app/db
    networks:
      - ft_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend service with nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://localhost
        - REACT_APP_WS_URL=https://localhost
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-739568275808-eppkqrsshd1o2gcb3iao8trubn6oa01k.apps.googleusercontent.com}
    container_name: ft_transcendence_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ft_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SSL certificate generator (runs once)
  ssl-generator:
    image: alpine:latest
    container_name: ft_transcendence_ssl
    volumes:
      - ./ssl:/ssl
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache openssl > /dev/null 2>&1
        if [ ! -f /ssl/cert.pem ]; then
          echo 'Generating SSL certificates...'
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/key.pem \
            -out /ssl/cert.pem \
            -subj '/C=FR/ST=IDF/L=Paris/O=42/OU=ft_transcendence/CN=localhost'
          chmod 644 /ssl/cert.pem /ssl/key.pem
          echo 'SSL certificates generated successfully!'
        else
          echo 'SSL certificates already exist.'
        fi
    networks:
      - ft_network

networks:
  ft_network:
    driver: bridge

volumes:
  backend_data:
    driver: local
